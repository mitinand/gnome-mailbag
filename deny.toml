[graph]
all-features = true

[licenses]
include-dev = true
confidence-threshold = 0.93
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "Unicode-3.0"]

# Skip unpublished workspace packages; external dependencies remain checked.
[licenses.private]
ignore = true

# crates.io and the two maintained forks (specs/002-imap-integration/research.md §3).
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/mitinand/async-imap",
    "https://github.com/mitinand/imap-proto",
]
