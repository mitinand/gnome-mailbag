name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 30
    env:
      CARGO_HOME: /opt/mailbag-cargo
      RUSTUP_HOME: /opt/mailbag-rustup
    steps:
      - name: Install Fedora tools
        run: dnf install -y git gcc gtk4-devel libadwaita-devel pkgconf-pkg-config desktop-file-utils appstream curl tar xz zstd
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trust this container checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Restore Cargo sources
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            /opt/mailbag-cargo/registry
            /opt/mailbag-cargo/git
          key: cargo-sources-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-sources-${{ runner.os }}-${{ runner.arch }}-
      - name: Read cargo-deny version
        run: |
          . scripts/tool-versions.env
          echo "CARGO_DENY_VERSION=$CARGO_DENY_VERSION" >> "$GITHUB_ENV"
      - name: Restore cargo-deny
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: /opt/mailbag-tools
          key: cargo-deny-fedora44-${{ runner.arch }}-${{ env.CARGO_DENY_VERSION }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Install Rust from rust-toolchain.toml
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --no-modify-path --default-toolchain none
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          echo "/opt/mailbag-tools/bin" >> "$GITHUB_PATH"
      - name: Install cargo-deny
        run: |
          if [ "$(cargo deny --version 2>/dev/null)" != "cargo-deny $CARGO_DENY_VERSION" ]; then
            cargo install cargo-deny --version "=$CARGO_DENY_VERSION" --locked --root /opt/mailbag-tools
          fi
      - name: Canonical checks
        run: scripts/check.sh
      - name: Check dependency advisories
        run: cargo deny check advisories

  flatpak:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Flatpak tools
        run: sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder
      - name: Install SDK and runtime
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --install-deps-only --install-deps-from=flathub build-dir io.github.mitinand.Mailbag.yml
      - name: Build and export Flatpak
        run: scripts/build-flatpak.sh
