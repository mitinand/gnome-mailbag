[package]
name = "mailbag-providers"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/mitinand/gnome-mailbag"
publish = false

[dependencies]
# Runtime-independent channels between GTK's context and the mail worker.
async-channel = "2"
futures-util = "0.3"
glib.workspace = true
goa-adapter = { path = "../goa-adapter" }
mailbag-content = { path = "../mailbag-content" }
mailbag-imap = { path = "../mailbag-imap" }
tracing.workspace = true

[dev-dependencies]
# Load-sequence tests drive the scripted IMAP server.
mailbag-imap = { path = "../mailbag-imap", features = ["test-support"] }
# Tests read the lines a load logs (tests/support/record.rs).
tracing-subscriber.workspace = true

[lints]
workspace = true
