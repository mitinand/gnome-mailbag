[package]
name = "mailbag-graph"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/mitinand/gnome-mailbag"
publish = false

[features]
# The scripted Microsoft Graph service, for the load-sequence tests in mailbag-providers.
test-support = []

[dependencies]
gio.workspace = true
glib.workspace = true
# HTTPS through libsoup 3 on the worker's GLib context (specs/005-microsoft-graph-integration/research.md §2).
soup3 = "=0.9.0"
# The answer is read as a JSON value, without derive (research.md §3).
serde_json = "1"
tracing.workspace = true

[dev-dependencies]
# Tests read the lines a request logs (tests/support/record.rs).
tracing-subscriber.workspace = true

[lints]
workspace = true
