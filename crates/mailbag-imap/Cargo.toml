[package]
name = "mailbag-imap"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/mitinand/gnome-mailbag"
publish = false

[features]
# The scripted IMAP server, for the load-sequence tests in mailbag.
test-support = ["gio/v2_60"]

[dependencies]
async-imap = { version = "=0.11.3", default-features = false, features = ["runtime-futures"] }
# futures-io traits for the GIO stream bridge and FETCH response streams.
futures-util = { version = "0.3", features = ["io"] }
gio.workspace = true
glib.workspace = true
# async-imap traces every command, including sign-in, at trace level.
log = { version = "0.4", features = ["max_level_off", "release_max_level_off"] }
tracing.workspace = true

[dev-dependencies]
# Tests trust the test CA through GIO's default certificate database.
gio = { workspace = true, features = ["v2_60"] }

[lints]
workspace = true
