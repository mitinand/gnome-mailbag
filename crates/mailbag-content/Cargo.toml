[package]
name = "mailbag-content"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/mitinand/gnome-mailbag"
publish = false

[dependencies]
mail-parser = { version = "0.11.9", features = ["full_encoding"] }
tracing.workspace = true

[dev-dependencies]
# Tests read the lines the content rules log (tests/support/record.rs).
tracing-subscriber.workspace = true

[lints]
workspace = true
