[package]
name = "mailbag"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/mitinand/gnome-mailbag"
publish = false

[dependencies]
adw = { workspace = true, features = ["gtk_v4_10"] }
# Runtime-independent channels between GTK's context and the mail worker.
async-channel = "2"
futures-util = "0.3"
goa-adapter = { path = "../goa-adapter" }
mailbag-content = { path = "../mailbag-content" }
# The failure kinds of the Microsoft 365 load, which the window words.
mailbag-graph = { path = "../mailbag-graph" }
mailbag-imap = { path = "../mailbag-imap" }
mailbag-providers = { path = "../mailbag-providers" }
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
