app-id: io.github.mitinand.Mailbag
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: mailbag
finish-args:
  - --socket=wayland
  - --device=dri
  - --talk-name=org.gnome.OnlineAccounts
  - --talk-name=org.gnome.Settings
  # Mail is read directly from the account's IMAP server.
  - --share=network
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    # cargo-sources.json places the vendored crates and their Cargo config here.
    CARGO_HOME: /run/build/mailbag/cargo
    CARGO_NET_OFFLINE: 'true'
modules:
  - name: mailbag
    buildsystem: meson
    config-opts: [--buildtype=release, -Dcargo_vendor_dir=/run/build/mailbag/cargo/vendor]
    # Meson installs licenses on both old and new builder versions.
    license-files: []
    sources:
      - type: file
        path: meson.build
      - type: file
        path: meson.options
      - type: file
        path: Cargo.toml
      - type: file
        path: Cargo.lock
      - type: file
        path: LICENSE
      - type: dir
        path: LICENSES
        dest: LICENSES
      - type: dir
        path: crates
        dest: crates
      - type: dir
        path: data
        dest: data
      - type: dir
        path: third-party-notices
        dest: third-party-notices
      - cargo-sources.json
