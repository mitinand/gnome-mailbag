[workspace]
members = ["crates/mailbag", "crates/goa-adapter", "crates/account-source"]
default-members = ["crates/mailbag"]
resolver = "3"

[workspace.dependencies]
gio = "=0.22.9"
glib = "=0.22.9"
adw = { package = "libadwaita", version = "=0.9.2", features = ["v1_8"] }

[workspace.lints.rust]
unsafe_code = "forbid"
