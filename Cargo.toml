[workspace]
members = [
    "crates/mailbag",
    "crates/goa-adapter",
    "crates/mailbag-domain",
    "crates/mailbag-imap",
    "crates/mailbag-content",
    "crates/mailbag-providers",
    "crates/mailbag-store",
    "crates/mailbag-graph",
]
default-members = ["crates/mailbag"]
resolver = "3"

[workspace.dependencies]
gio = "=0.22.9"
glib = "=0.22.9"
adw = { package = "libadwaita", version = "=0.9.2", features = ["v1_8"] }
# Without attributes, so no proc macro is built (specs/003-logging/research.md §1).
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# The span registry, level filter and one-line formatter, without colors or the
# bridge from the log crate (specs/003-logging/research.md §1).
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "registry", "fmt"] }

[workspace.lints.rust]
unsafe_code = "forbid"

# Maintained forks at full revisions; see specs/002-imap-integration/research.md §3.
[patch.crates-io]
async-imap = { git = "https://github.com/mitinand/async-imap", rev = "06497e037a11a1c8aa56dcea02cfaddb526fa7a4" }
imap-proto = { git = "https://github.com/mitinand/imap-proto", rev = "6adb66087055c8ac64e442ca6cf465227277e912" }
